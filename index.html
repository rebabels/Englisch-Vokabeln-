<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vokabeltrainer</title><link rel="stylesheet" href="style.css"></head><body><main><h1>🇬🇧 Vokabeltrainer</h1><p id="counter">Lade Vokabeln …</p><label>Abfragerichtung <select id="direction"><option value="de">Deutsch → Englisch</option><option value="en">Englisch → Deutsch</option></select></label><section class="card"><div id="question"></div><div id="answer" hidden></div></section><div class="buttons"><button id="reveal">Antwort zeigen</button><button id="speak">🔊 Englisch anhören</button></div><div class="buttons"><button id="repeat">🔁 Später wiederholen</button><button id="next">Nächste →</button></div><p id="message" role="status"></p><details><summary>Eigene Vokabeln laden</summary><p>Eine JSON-Datei im Format [{"en":"hello","de":"hallo"}] auswählen. Für dauerhaft neue Vokabeln die Datei vocabulary.json auf GitHub ersetzen.</p><input id="upload" type="file" accept=".json,application/json"></details></main><script src="app.js"></script></body></html>
